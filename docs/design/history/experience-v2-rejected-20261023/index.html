<script>

const readingPrompt='我想把看到的文章和访谈放在一个地方，记住读到哪、自己有什么想法。原文保留，不要替我把 AI 摘要算成已读。';
const products=[
{id:'twin',name:'Agent Twin · AI 分身',title:'让项目经验，成为可以复用的判断',description:'从你选定的项目材料开始，整理有来源的知识与工作方法。先看清它知道什么，再决定让它做什么。',condition:'公开预发布包 · 先选材料、核对来源与权限',version:'0.3.0',status:'发行资产曾核对；实际功能仍需单独验收',prompt:'我想把选定项目里的零散资料整理成自己的 AI 分身知识，保留每条判断的来源和缺口。先准备材料和只读核对。',interest:'项目沉淀',requirements:['DeepSeek Harness 0.2.1-rc.2、Node.js 22+；其他版本需再核对。','明确选择可读取的项目与材料；消息通道需要本人授权。'],limits:'此版以只读探测和权限核对为主；不承诺自动外发、业务执行或常驻服务。',output:['项目材料','来源与缺口','可复用的工作方法']},
{id:'family',name:'微信家庭助手',title:'给家人各自一个日常助手',description:'各自聊天、提醒与资讯，分开保留偏好和记录。由管理者维护连接，只查看成员同意分享的内容。',condition:'本地预览 · 成员分别授权，电脑端需在线',version:'0.1.0-preview.4',status:'本地预览，未公开发布',prompt:'我想给多位家人分别准备微信里的日常聊天、提醒和资讯小助手，各自保留偏好和记录。管理者只查看成员同意分享的内容，先了解连接前提。',interest:'家庭日常',requirements:['每位成员本人扫码授权，分别选择记录分享范围。','已配置模型的 Harness、Node.js 22.13+，电脑与宿主保持在线。'],limits:'真实扫码、模型调用、定时投递和手机显示需要分别验收；接口接收不代表手机收到或已读。',output:['独立会话','成员偏好','同意分享的内容']},
{id:'dsh-dot',name:'DSH Dot · Harness 项目助理',title:'从手机，接着做电脑上的项目',description:'查看选定项目的变化与阻塞，明确交办后接回执行回复。先从一次只读项目简报开始。',condition:'开发预览 · 需要微信桥接与可用项目',version:'0.12.0-preview.1',status:'当前版本尚无核对通过的公开下载',prompt:'我想从手机微信里查看选定项目的变化、阻塞和下一步，明确交办后再执行。先做一次只读项目简报，并区分执行回复与实际送达。',interest:'手机接续',requirements:['可用的 Harness 项目会话、已配置模型与本人授权的微信桥接。','电脑、宿主与通道保持可用；宿主版本需匹配。'],limits:'社区增强产品，依赖官方宿主。持续运行、手机恢复和实际送达没有在此原型中验证。',output:['项目变化','待决定的事','下一步与执行回复']},
{id:'dot-harness',name:'Dot 连接 Harness',title:'让已有助手读到另一端的资料',description:'在明确授权的范围里，读取 Harness 项目资料和已保存会话。连接器与管理入口是一套方案。',condition:'单人私有预览 · 需要已有 Dot 与受限连接',version:'0.3.0-preview.3',status:'单人私有连接器，无公开发行入口',prompt:'我想让已有 OpenAI Dot 读取本人明确授权的 Harness 项目资料与已保存会话，并向独立测试项目交办有界只读任务。需要看清访问记录与取消范围。',interest:'跨端连接',requirements:['已有 OpenAI Dot、单人私有 MCP 连接与受限隧道。','匹配的 Harness、Node.js 22.13+、Python 3.10+；任务通道使用独立宿主。'],limits:'已保存资料不等于实时完整上下文。只读任务限于明确授权的独立测试材料，不支持共享安装。',output:['获授权的项目','访问记录','关联的有界任务']}
];
const defaultState={homeDraft:'',homeDrafts:[],page:'home',tasks:[],activeId:null,interest:'',scenario:'normal',createIntent:false};
let state;try{state={...defaultState,...JSON.parse(sessionStorage.getItem(STORAGE)||'{}')}}catch{state={...defaultState}}
state.tasks=Array.isArray(state.tasks)?state.tasks:[];state.homeDrafts=Array.isArray(state.homeDrafts)?state.homeDrafts:[];
for(const task of state.tasks){if(task.status==='searching'){task.status='cancelled';task.stage=0;}task.blockDrafts=task.blockDrafts||{};}
if(state.page==='work'&&!state.tasks.some(t=>t.id===state.activeId))state.page='home';
const app=document.getElementById('app');const modal=document.getElementById('modal');let epoch=0,toastTimer,opener;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const current=()=>state.tasks.find(t=>t.id===state.activeId);
const save=()=>{try{sessionStorage.setItem(STORAGE,JSON.stringify(state))}catch{announce('浏览器未允许本地存储，本次页面内仍可继续。')}};
function announce(text){document.getElementById('announce').textContent=text}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.remove('hidden');announce(text);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2800)}
function button(label,action,kind='secondary',extra=''){return `<button class="button ${kind}" data-action="${action}" ${extra}>${label}</button>`}
function header(){return `<header class="topbar"><button class="brand" data-action="home" aria-label="Finder 首页"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Finder</span></button><span class="brand-note">把想法接到<br>可行方案</span><div style="flex:1"></div><nav class="header-actions" aria-label="Finder 操作">${button('继续记录'+(state.tasks.length?' <span class="small">'+state.tasks.length+'</span>':''),'history','ghost')}${button('原型说明','about','ghost')}</nav></header>`}
function productPreview(p){return `<div class="product-output"><strong>${p.id==='twin'?'一份有来处的经验索引':p.id==='family'?'每个人都有自己的使用范围':p.id==='dsh-dot'?'先收到一份能接着做的项目简报':'把访问范围放在连接之前'} <span class="muted" style="font-weight:400;font-size:13px">／示例</span></strong>${p.output.map((x,i)=>`<div class="output-line"><span>${esc(x)}</span><span>${['选定后才读取','保留出处与边界','逐项确认再继续'][i]}</span></div>`).join('')}</div>`}
function productCard(p,lead){const reason=state.interest===p.interest?`<p class="interest-reason">因为你在演示中选择了「${esc(p.interest)}」</p>`:'';return lead?`<article class="feature-lead"><div><p class="product-name">${p.name}</p><h3>${p.title}</h3><p class="description">${p.description}</p>${reason}<p class="product-evidence"><span class="evidence-dot" aria-hidden="true"></span>${p.condition}</p><div class="feature-actions">${button('了解这条路径','detail','secondary',`data-id="${p.id}"`)}${button('试试这个场景','product-seed','text',`data-id="${p.id}"`)}</div></div>${productPreview(p)}</article>`:`<article class="feature-row"><p class="product-name">${p.name}</p><h3>${p.title}</h3><p class="description">${p.description}</p>${reason}<div class="row-bottom"><span>${p.condition}</span>${button('查看路径','detail','text',`data-id="${p.id}"`)}</div></article>`}
function home(){const ordered=[...products].sort((a,b)=>(b.interest===state.interest?1:0)-(a.interest===state.interest?1:0));const active=current();return `<main class="home"><section class="hero-grid" aria-labelledby="home-title"><div><h1 class="hero-title" id="home-title">你想让助手做什么？</h1><p class="hero-intro">从你要做的事开始。一起找现成的能力，也把还缺的部分变成能继续的方案。</p><form id="home-form" class="composer-home"><label for="home-input">说说你的想法</label><textarea id="home-input" name="request" placeholder="比如，我想把读过的文章整理起来，记住读到哪……" maxlength="2500">${esc(state.homeDraft)}</textarea><div class="composer-bottom"><span class="small muted">先说目标，细节可以边聊边补</span><button class="button primary" type="submit">${state.createIntent?'开始设计演示':'帮我找方案'}<span class="arrow" aria-hidden="true">↗</span></button></div></form><div class="start-helpers"><span class="small muted">当前是有界交互演示</span>${button('试试定制示例','custom-seed','text small')}</div><div class="examples-list"><p class="examples-title">也可以从一句具体需求开始</p><button class="example-line" data-action="seed" data-seed="organize"><span class="arrow" aria-hidden="true">↗</span><span>把会议里的待办整理成按负责人分组的清单，先让我确认。</span></button><button class="example-line" data-action="seed" data-seed="project"><span class="arrow" aria-hidden="true">↗</span><span>在微信里看选定项目的变化和阻塞，明确交办后再执行。</span></button></div></div><aside class="example-panel" aria-label="阅读需求示例"><p class="example-heading">一个可以直接试的想法</p><h2>让每次阅读，<br>都能从上次继续。</h2><p>文章、访谈和自己的想法放在一起，AI 整理与本人已读分别记录。</p><div class="mini-artifact"><div class="artifact-head"><strong>我的阅读清单</strong><span>成果示例</span></div><div class="reading-item"><span>一篇长文，读到第 3 节</span><span class="read-state">进行中</span></div><div class="reading-item"><span>一句自己的想法</span><span class="read-state">已保留</span></div><div class="reading-item"><span>访谈原文与来源</span><span class="read-state">待阅读</span></div></div>${button('试试这个完整需求','seed','text',`data-seed="reading"`)}<p class="sample-note">只预填需求，你可以改完再开始。</p></aside></section>${active?`<div class="resume-strip"><span>还有一条正在继续的想法：<strong>${esc(active.title)}</strong>${active.draft?'（保留了未提交补充）':''}</span>${button('回到这条记录','resume','text small')}</div>`:''}<section class="curation" aria-labelledby="curation-title"><div class="section-top"><div><h2 id="curation-title">${state.interest?'猜你喜欢':'编辑精选'}</h2><p>${state.interest?'仅依据你在本原型里选的「'+esc(state.interest)+'」调整顺序；其他路径仍保留在这里。':'四条值得了解的起点。由作者策展，先讲能得到什么，再把使用前提说清楚。'}</p></div>${button(state.interest?'调整兴趣':'选择演示兴趣','interests','text small')}</div><div class="catalog-grid">${productCard(ordered[0],true)}<div class="feature-list">${ordered.slice(1).map(p=>productCard(p,false)).join('')}</div></div></section><footer class="footer-note"><span class="prototype-pill">设计原型 / 演示数据</span><span>未连接模型、真实历史、安装服务或 Creator。</span></footer></main>`}
function classify(text){if(/家人|家庭/.test(text))return'family';if(/分身|twin/i.test(text))return'twin';if(/OpenAI\s*Dot|跨端|另一端|另一个工作环境|MCP|连接器/i.test(text))return'dot-harness';if(/微信.*项目|手机.*项目|项目.*微信|DSH\s*Dot/i.test(text))return'dsh-dot';if(/会议|待办|任务清单|负责人/.test(text))return'organize';if(/阅读|文章|访谈|读书/.test(text))return'reading';return'unknown'}
function taskTitle(kind){return({reading:'接着上次继续阅读',twin:'沉淀自己的项目经验',family:'给家人准备日常助手','dsh-dot':'从手机继续项目','dot-harness':'连接另一端的项目资料',organize:'把会议待办变成可确认的清单',unknown:'保留一个新想法'})[kind]}
function message(task,role,text,note=''){task.messages.push({role,text,note})}
function captureVersion(task,label){task.versions.push({version:task.version,label,mode:task.mode,readOnly:task.readOnly,scopeOnly:task.scopeOnly,blueprint:task.blueprint?{...task.blueprint}:null});}
function replaceHomeDraft(text,createIntent=false){const old=state.homeDraft.trim();if(old&&old!==text.trim()&&!state.homeDrafts.some(d=>d.text===old)){state.homeDrafts.unshift({id:'draft-'+Date.now(),text:old,createIntent:state.createIntent});state.homeDrafts=state.homeDrafts.slice(0,10);}state.homeDraft=text;state.createIntent=createIntent;}
function cancelOtherOperations(task){state.tasks.forEach(other=>{if(other.id!==task.id&&other.status==='searching'){other.status='cancelled';other.stage=0;}});}
function startTask(text,forceCustom=false){text=text.trim();if(!text){toast('先写下一句想完成的事，也可以点选示例。');document.getElementById('home-input')?.focus();return}epoch++;state.tasks.forEach(t=>{if(t.status==='searching'){t.status='cancelled';t.stage=0;}});const kind=classify(text);const task={id:'demo-'+Date.now()+'-'+Math.random().toString(36).slice(2,5),request:text,title:taskTitle(kind),kind,status:'searching',stage:1,messages:[],draft:'',version:1,versions:[],mode:'plan',readOnly:/原文(保持)?只读|原文保留|保留原文/.test(text)&&!/(不要|不想|无需|不用|取消)[^。；]*只读/.test(text),scopeOnly:false,sourceIncomplete:state.scenario==='incomplete',forceCustom,blockDrafts:{},createdAt:Date.now()};message(task,'user',text);state.tasks.unshift(task);state.activeId=task.id;state.homeDraft=text;state.createIntent=false;state.page='work';save();render();runSearch(task);}
function runSearch(task){cancelOtherOperations(task);const token=++epoch;task.status='searching';task.stage=1;save();render();announce('正在演示理解需求，原请求已保留。');setTimeout(()=>{if(token!==epoch||task.status!=='searching')return;task.stage=2;save();if(current()?.id===task.id)render();announce('正在演示查找可复用能力。')},550);setTimeout(()=>{if(token!==epoch||task.status!=='searching')return;task.status=task.kind==='unknown'?'unknown':'ready';task.stage=0;if(task.status==='unknown'){message(task,'assistant','这个原型还没有包含这类任务的演示。我保留了你的原话；你可以试下面的示例，或把这个想法留在记录里。','没有把你的想法套进其他场景。')}else{message(task,'assistant',initialReply(task),task.sourceIncomplete?'有部分资料未返回；这是暂定建议，可以重试。':'这是演示建议，依据是预设场景与策展资料。');captureVersion(task,'第一版方案');if(task.forceCustom)beginCreate(task,false);}save();if(current()?.id===task.id)render();announce(task.status==='unknown'?'想法已保留，当前没有对应演示。':'演示方案已准备好。')},1250)}
function initialReply(t){if(t.kind==='reading')return'先用一份持续更新的阅读台账接住这些内容。它记录你读到哪、自己的想法和原文来源；摘要与“本人已读”分开。之后需要更顺手的入口，再把这套流程做成小助手。';if(t.kind==='organize')return'先生成一份按负责人分组、等待你确认的待办清单。确认之前不写回任务工具。首版可以从你粘贴的一段会议记录开始。';return({'twin':'Agent Twin 可以作为这条路径的起点：先整理你选中的项目材料，保留来源和缺口，再核对使用范围。','family':'微信家庭助手与这个目标相关。先核对每位成员的授权、分享范围和电脑在线条件，再讨论提醒与日报。','dsh-dot':'DSH Dot 与这个目标相关。先做只读项目简报，核对手机接续和桥接条件，再尝试明确交办。','dot-harness':'Dot 连接 Harness 与这个目标相关。先划定能读取的项目与已保存资料，再核对私有连接条件。'})[t.kind]}
function messages(t){return t.messages.map(m=>`<article class="message ${m.role}"><div class="message-label ${m.role==='assistant'?'assistant':''}">${m.role==='user'?'你':'Finder'}</div><div class="message-body">${esc(m.text)}</div>${m.note?`<p class="message-status">${esc(m.note)}</p>`:''}</article>`).join('')}
function conversation(t){return `<section class="conversation" id="current-conversation" tabindex="-1" aria-label="围绕这个需求继续对话"><div class="conversation-title"><h2>一起把想法说清楚</h2><span>${t.status==='searching'?'演示进行中':'同一条需求'}</span></div><div class="messages" id="messages">${messages(t)}${t.status==='searching'?`<div class="message"><div class="message-label assistant">Finder</div><div class="message-body muted">${t.stage===1?'正在演示整理目标与边界……':'正在演示查找可复用的路径……'}</div><p class="message-status">有界脚本，没有调用模型或真实搜索。</p></div>`:''}</div>${t.status==='ready'&&t.mode==='plan'&&t.kind==='reading'?`<div class="chat-suggestions"><button class="suggestion" data-action="correction" data-text="原文只读">原文只读</button><button class="suggestion" data-action="correction" data-text="只做阅读状态">只做阅读状态</button><button class="suggestion" data-action="customize">我想做成自己的小助手</button></div>`:''}<form id="chat-form" class="chat-form"><label class="sr-only" for="chat-input">补充或修正这个需求</label><textarea id="chat-input" placeholder="${t.mode==='clarify'?'可以选一句，也可以补充自己的范围……':'再补一句，继续调整这份方案……'}" maxlength="1600" ${t.status==='searching'?'disabled':''}>${esc(t.draft)}</textarea><div class="chat-bottom"><span class="small">${t.status==='searching'?'可以取消，原话会保留':'演示支持：原文只读、只做阅读状态、继续定制'}</span><button class="button primary small" type="submit" aria-label="发送补充" ${t.status==='searching'?'disabled':''}>发送</button></div></form></section>`}
function waiting(t){return `<div class="outcome-top"><h2>正在寻找路径</h2><span class="small muted">演示状态</span></div><section class="waiting"><p class="small">你的原话保留在左侧</p><h2>先理解目标，<br>再看怎样继续。</h2><p>以下阶段由本地脚本模拟。没有实际检索，也没有预计完成时间。</p><ul class="stage-list"><li class="${t.stage===1?'active':'done'}"><span class="stage-marker" aria-hidden="true"></span>整理目标与边界</li><li class="${t.stage===2?'active':''}"><span class="stage-marker" aria-hidden="true"></span>查找可复用的能力</li></ul>${button('取消这次查找','cancel-search','secondary')}</section>`}
function cancelled(t){return `<div class="outcome-top"><h2>这条想法还在</h2></div><section class="empty-artifact"><h2>查找已经停止。</h2><p>你的原话和未提交的内容都保留了。继续时会重新演示查找，迟到的结果不会覆盖当前需求。</p>${button('继续查找演示','retry-search','primary')}<br>${button('回首页修改原话','edit-request','text')}</section>`}
function unknown(t){return `<div class="outcome-top"><h2>已保留你的想法</h2></div><section class="empty-artifact"><h2>这类任务，原型还没有演示。</h2><p>目前只演示阅读、会议待办，以及首页四条策展路径。记录已保存在本浏览器的这次会话中。</p><div class="quick-start">${button('试阅读整理示例 <span aria-hidden="true">↗</span>','seed','secondary','data-seed="reading"')}${button('试会议待办示例 <span aria-hidden="true">↗</span>','seed','secondary','data-seed="organize"')}</div>${button('保留这个想法，稍后继续','keep-idea','text')}</section>`}
function planInfo(t){if(t.kind==='reading')return{title:t.scopeOnly?'只记录读到哪，先把阅读接起来':'一份能从上次继续的阅读台账',summary:t.scopeOnly?'首版只保留标题、来源和阅读状态。先把“读到哪”记准，自己的想法和 AI 摘要暂不纳入。':'文章与访谈有一个稳定位置；每次回来，都知道读到哪、留下过什么想法。',goal:t.scopeOnly?'标题 / 原文链接 / 阅读状态':'原文来源 / 本人阅读状态 / 一句自己的想法',reasons:[['沿用现有项目资料','在你选定的项目里维护一份清单，起步范围清楚。'],[t.readOnly?'原文只读已写入方案':'保留每条内容的来处',t.readOnly?'只写阅读记录，不修改原文章、访谈文本或原文件。':'原文与整理结果分开保留；读取范围由你选择。'],[t.scopeOnly?'首版收窄到阅读状态':'把本人已读与 AI 整理分开',t.scopeOnly?'不生成摘要或评价；先支持待阅读、进行中、已读。':'AI 摘要不能自动把记录改成“已读”。']],cta:'准备阅读台账',pre:'先选择一个可写入记录的项目；原文读取范围由你确认。'};if(t.kind==='organize')return{title:'一份先确认、再写回的会议待办',summary:'从会议原文提取候选任务，按负责人分组。保留出处和待确认项，再由你决定是否写回。',goal:'候选待办 / 负责人 / 截止时间 / 原文位置',reasons:[['先从一段记录开始','手动粘贴或明确选择文件，不扫描其他会议。'],['归属不明确就保留待确认','不把讨论、建议或他人承诺直接当成你的任务。'],['确认后才进入下一步','此原型只生成本地起步清单，不写入真实任务工具。']],cta:'准备待办起步清单',pre:'需要你提供一段会议记录，并核对任务归属。'};const p=products.find(p=>p.id===t.kind);return{title:p.title,summary:p.description,goal:p.output.join(' / '),reasons:[['与你的目标对应',p.output.join('、')+'围绕同一条路径承接。'],['先看清使用前提',p.requirements[0]],[p.status,p.limits]],cta:'准备接入核对清单',pre:p.requirements[1]}}
function incomplete(t){return t.sourceIncomplete?`<div class="notice"><strong>部分来源尚未返回，建议还不完整。</strong>这里保留已返回的演示资料。搜索未完成，不能据此判断没有合适插件。<br>${button('重新查找资料（演示）','retry-sources','text small')}</div>`:''}
function sources(t){return `<div class="source-details"><details><summary>为什么这样推荐？查看来源与边界</summary><div class="source-content"><p>本原型的判断来自预设场景与静态策展资料，没有读取真实项目、调用模型或进行实时核验。</p><div class="source-row"><strong>${t.kind==='reading'||t.kind==='organize'?'场景设计 · 现有项目资料与可确认的结果':products.find(p=>p.id===t.kind)?.name}</strong>${t.kind==='reading'||t.kind==='organize'?'以手动提供资料、原文可追溯、用户确认后继续为起步约束。':'策展快照：2026-10-22；版本 '+products.find(p=>p.id===t.kind)?.version+'。公开资产核对与真实功能验收是不同证据。'}</div><div class="source-row"><strong>当前没有证明的事</strong>没有验证实际模型效果、宿主接入、安装、持续运行或外部送达。这里的“可继续”指本地交互演示。</div></div></details><details><summary>还有别的做法吗？</summary><div class="source-content"><div class="alternative"><strong>先用更小的手动流程</strong><p>保留原需求，缩小首版；先检查信息和输出是否真的有用。</p>${button('用这个方向重新评估','alternative','text small')}</div><div class="alternative"><strong>直接定制一个专用入口</strong><p>沿用这条需求和已确认边界，先形成可审阅的蓝图。</p>${button('沿这个方向继续定制','customize','text small')}</div></div></details></div>`}
function plan(t){const p=planInfo(t);return `<div class="outcome-top"><h2>这次可以怎样做</h2><button class="version-button" data-action="versions">方案 v${t.version} · 版本记录</button></div>${incomplete(t)}<article class="plan"><div class="plan-main"><p class="plan-kicker">${t.kind==='reading'||t.kind==='organize'?'先复用项目里的文件能力':'一条相关的策展路径'} · 演示建议</p><h2>${p.title}</h2><p class="plan-summary">${p.summary}</p><div class="plan-goal"><strong>得到</strong><span>${p.goal}</span></div><ul class="reason-list">${p.reasons.map(r=>`<li>${r[0]}<span>${r[1]}</span></li>`).join('')}</ul></div><div class="next-area">${button(p.cta,'prepare','primary')}<p class="small">${p.pre}</p></div></article><div class="below-actions">${button('在此基础上定制','customize','text')}${button('修改原需求','edit-request','ghost')}</div>${sources(t)}`}
function clarifyView(t){return `<div class="outcome-top"><h2>把想法变成蓝图</h2><button class="version-button" data-action="versions">沿用方案 v${t.version}</button></div>${incomplete(t)}<article class="plan"><div class="plan-main"><p class="plan-kicker">从现有上下文继续</p><h2>${t.kind==='reading'?'做一个能接着阅读的小助手':'把这条路径做成自己的能力'}</h2><p class="plan-summary">原需求、已确认边界和当前方案都会带入。先定首版范围，再准备 Creator 草稿。</p><div class="plan-goal"><strong>已带入</strong><span>${esc(planInfo(t).goal)}${t.readOnly?'；原文只读':''}</span></div><div class="ability-note"><strong>可以怎样实现</strong><p>用选定资料作为输入，在同一项目里维护结构化记录；用对话更新，用可读卡片核对结果。</p></div><details><summary>看一个相近做法与能力边界</summary><div class="source-content">阅读清单是这里的演示案例：用户说“读到第 3 节”，更新对应记录；原文链接保留。正式实现仍需核对文件读写、模型配置和宿主能力。</div></details></div></article><section class="question-card"><p class="small muted">首版只差一个决定</p><h3>这些记录先给谁使用？</h3><div class="choice-row">${button('只给我自己用','clarify','primary','data-text="只给我自己用"')}${button('首版自己用，之后再分享','clarify','secondary','data-text="首版自己用，之后再分享"')}</div><p class="small muted" style="margin-top:14px">也可以在对话里补充自己的范围。其他技术细节先放进蓝图核对。</p></section>`}
const blockNames={scope:'首版范围',io:'输入与产出',data:'数据与权限',acceptance:'怎样算做成'};
function blueprintView(t){return `<div class="outcome-top"><h2>可以继续修改的蓝图</h2><button class="version-button" data-action="versions">蓝图 v${t.version} · 版本记录</button></div>${incomplete(t)}<article class="plan"><div class="blueprint-intro"><p class="plan-kicker">已沿用本次需求 · 尚未交给 Creator</p><h2>${t.kind==='reading'?'我的阅读接续小助手':t.title}</h2><p class="plan-summary">${esc(t.audience||'首版仅本人使用')}。你可以直接补一句，也可以只编辑需要改的那一块。</p></div>${Object.entries(blockNames).map(([key,name])=>`<section class="blueprint-block"><div class="block-heading"><h3>${name}</h3><button class="edit-button" data-action="edit-block" data-key="${key}">${t.blockDrafts[key]?'继续编辑':'编辑'}</button></div><p>${esc(t.blueprint[key])}</p>${t.blockDrafts[key]?'<div class="draft-mark">有暂存修改，尚未应用到蓝图</div>':''}</section>`).join('')}<div class="next-area">${button('准备 Creator 交接预览','handoff','primary')}<p class="small">先选择演示工作区，预览蓝图 v${t.version} 的草稿。</p></div></article><div class="below-actions">${button('查看原方案','original-plan','text')}${t.handoff?button('查看上次交接预览','last-handoff','ghost'):''}</div>`}
function work(){const t=current();if(!t)return home();const hasOutcome=t.status==='ready'&&(t.mode==='plan'||t.mode==='blueprint');return `<main class="work"><div class="work-heading"><div><div class="breadcrumb"><button data-action="home">首页</button><span aria-hidden="true">/</span><span>当前需求</span></div><h1>${esc(t.title)}</h1>${hasOutcome?`<a class="button text mobile-jump" href="#current-outcome">${t.mode==='blueprint'?'查看蓝图':'查看方案'}</a>`:''}</div><span class="prototype-pill">演示数据与有限脚本</span></div><div class="workspace-grid">${conversation(t)}<section class="outcome" id="current-outcome" tabindex="-1" aria-label="当前方案与成果">${hasOutcome?'<a class="button text mobile-jump" href="#current-conversation">回到对话</a>':''}${t.status==='searching'?waiting(t):t.status==='cancelled'?cancelled(t):t.status==='unknown'?unknown(t):t.mode==='clarify'?clarifyView(t):t.mode==='blueprint'?blueprintView(t):plan(t)}</section></div></main>`}

function render(){const old=document.activeElement?.id;app.innerHTML=`<div class="shell">${header()}${state.page==='work'?work():home()}</div>`;if(old==='chat-input')document.getElementById(old)?.focus();const messagesEl=document.getElementById('messages');if(messagesEl)messagesEl.scrollTop=messagesEl.scrollHeight}
function openDialog(title,subtitle,body,footer='',drawer=false){const wasOpen=modal.open;if(!wasOpen)opener=document.activeElement;modal.className='dialog'+(drawer?' drawer':'');modal.innerHTML=`<div class="dialog-head"><div><h2 id="modal-title">${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div><button class="close-button" data-action="close-modal" aria-label="关闭">×</button></div><div class="dialog-body">${body}</div>${footer?`<div class="dialog-footer">${footer}</div>`:''}`;if(!modal.open)modal.showModal();modal.scrollTop=0;if(wasOpen)modal.querySelector('.close-button')?.focus();}
function closeDialog(){modal.close();if(opener?.isConnected)opener.focus()}
function seed(kind){const text=kind==='reading'?readingPrompt:kind==='organize'?'我想每周把会议里的待办整理成按负责人分组的清单，保留原文出处。归属和日期不明确就留给我确认，确认后再写回。':'我想在微信里查看选定项目的变化、阻塞和下一步，明确交办后再执行。先做一次只读项目简报。';replaceHomeDraft(text);state.page='home';save();closeDialogIfOpen();render();document.getElementById('home-input')?.focus();toast('完整需求已预填，可以修改后开始。');}
function closeDialogIfOpen(){if(modal.open)closeDialog()}
function productDetail(id){const p=products.find(p=>p.id===id);if(!p)return;openDialog(p.name,'策展资料快照 · '+p.version+' · 非实时核验',`<h3>${p.title}</h3><p>${p.description}</p><div class="notice"><strong>现在可以怎样开始</strong>先准备需求，核对使用前提；这个原型不会安装、连接或读取你的资料。</div><h3>可以得到什么</h3><ul>${p.output.map(x=>`<li>${x}</li>`).join('')}</ul><h3>开始之前</h3><ul>${p.requirements.map(x=>`<li>${x}</li>`).join('')}</ul><h3>当前边界</h3><p>${p.status}。${p.limits}</p><div class="status-line">资料来自 2026-10-22 本地策展快照；真实发行、接入和任务结果需分别核对。此处不提供未经本轮核验的下载入口。</div>`,button('试试这个场景','product-seed','primary',`data-id="${p.id}"`),true)}
function beginCreate(t,addMessage=true){if(t.status!=='ready')return;t.mode='clarify';if(addMessage){message(t,'user','我想沿着这个需求，做一个自己的小助手。');message(t,'assistant','可以，继续沿用原需求和已经确认的边界。首版只需要先定一件事：这些记录先给谁使用？右侧保留了可复用的能力与一个相近案例。','这一步只准备蓝图，不创建插件。')}else message(t,'assistant','沿用刚才的需求开始定制。首版只差一个决定：这些记录先给谁使用？');save();render();announce('已进入蓝图准备，只需补充使用范围。')}
function createBlueprint(t,answer){t.audience=answer.includes('之后')?'首版仅本人使用，分享留到后续版本':answer==='只给我自己用'?'首版仅本人使用':answer;const reading=t.kind==='reading';t.blueprint={scope:reading?(t.scopeOnly?'首版只记录标题、来源与阅读状态；暂不生成摘要或想法整理。':'收集手动提供的文章与访谈，记录本人阅读状态和一句自己的想法。AI 整理与本人已读分开。'):'围绕本次原需求做一个小范围首版：'+t.request,io:reading?'输入：手动提供的标题、链接或选定文本。\n产出：'+(t.scopeOnly?'标题、原文链接、待阅读 / 进行中 / 已读状态。':'持续更新的阅读清单，每篇保留来源、当前状态与自己的想法。'):'输入：本人明确选择的项目资料。\n产出：可核对的结果卡与待确认项，不自动扩展任务范围。',data:(t.readOnly?'原文只读；只写入独立的记录文件。':'原文与记录分开；读取范围由本人选择。')+'\n'+t.audience+'；不扫描其他项目，不自动外发。',acceptance:reading?'说“读到第 3 节”后，更新同一条记录而不是重复新建；能回到原文；AI 摘要不会把状态改为本人已读。':'能根据原需求生成可核对的结果；补充修改回到同一条记录；来源不全与执行失败有恢复入口。'};t.mode='blueprint';t.version++;message(t,'assistant','蓝图已整理好，使用范围已写入。你可以补一句继续改，也可以按块编辑。交给 Creator 之前，还会先看工作区和草稿预览。','蓝图 v'+t.version+'，仍是本地演示内容。');captureVersion(t,'确认使用范围，形成蓝图');save();render();announce('蓝图已生成，可以逐块编辑。')}
function applyCorrection(text){const t=current();if(!t||t.status==='searching')return;text=text.trim();if(!text)return;message(t,'user',text);t.draft='';const normalized=text.replace(/[，。！？、,.!?；;\s]/g,'');const readonly=['原文只读','请保持原文只读','原文保持只读','原文设为只读','只读原文'].includes(normalized);const statusOnly=['只做阅读状态','先只做阅读状态','首版只做阅读状态','只记录阅读状态'].includes(normalized);const audience=['只给我自己用','只给我用','只供我自己使用','首版自己用之后再分享','首版只给我用'].includes(normalized);const customize=['不合适','不太合适','继续定制','我想继续定制','我想做成自己的小助手','我想做一个自己的小助手','做成自己的小助手','定制','重做'].includes(normalized);
if(t.status!=='ready'){message(t,'assistant','这条补充已原样保留。当前没有可修改的演示方案；你可以继续查找，或选一个完整示例。','没有生成新的理解或改动成果。');save();render();return}
if(t.mode==='clarify'&&audience){createBlueprint(t,normalized==='首版自己用之后再分享'?'首版自己用，之后再分享':'只给我自己用');return}
if(readonly&&(t.kind==='reading'||t.mode==='blueprint')){t.readOnly=true;t.version++;if(t.blueprint)t.blueprint.data='原文只读；只写入独立的记录文件。\n'+(t.audience||'仅本人使用')+'；不扫描其他项目，不自动外发。';message(t,'assistant','已把“原文只读”写进同一份方案：只更新独立阅读记录，不改原文章、访谈文本或原文件。'+(t.mode==='clarify'?' 使用范围仍待确认，请选一句继续。':''),'已更新至 v'+t.version);captureVersion(t,'确认原文只读');}
else if(statusOnly&&t.kind==='reading'){t.scopeOnly=true;t.version++;if(t.blueprint){t.blueprint.scope='首版只记录标题、来源与阅读状态；暂不生成摘要、评价或想法整理。';t.blueprint.io='输入：手动提供的标题、链接。\n产出：标题、原文链接、待阅读 / 进行中 / 已读状态。'}message(t,'assistant','首版已收窄到阅读状态：保留标题、原文链接和读到哪。摘要与想法整理先移出范围，仍然沿用这条需求。'+(t.mode==='clarify'?' 使用范围仍待确认，请选一句继续。':''),'已更新至 v'+t.version);captureVersion(t,'首版只做阅读状态');}
else if(customize){message(t,'assistant','沿用当前需求继续定制。首版只差一个决定：这些记录先给谁使用？');t.mode='clarify';}
else{message(t,'assistant',t.mode==='clarify'?'这条补充已原样保留，使用范围仍待确认。当前演示支持“只给我自己用”或“首版自己用，之后再分享”；没有把其他回答当成已确认范围。':'这条补充已保留在对话里。当前有限演示还不能把它转换成方案变更；你可以试“原文只读”“只做阅读状态”，或直接编辑蓝图。','没有声称已理解，也没有改动成果。')}save();render();announce('补充已保留。')}

function versionDialog(t){openDialog('这条需求的版本','每次修改仍围绕同一个需求。',t.versions.length?t.versions.slice().reverse().map(v=>`<div class="history-item"><h3>v${v.version} · ${esc(v.label)}</h3><p>${v.readOnly?'原文只读':'原文范围待确认'}；${v.scopeOnly?'首版只做阅读状态':'保留当前方案范围'}。</p>${v.blueprint?`<div class="code-preview">${esc(v.blueprint.scope)}\n\n${esc(v.blueprint.data)}</div>`:''}</div>`).join(''):'<p>找到第一份方案后，会在这里保留版本。</p>')}
function handoffText(t,workspace){return `【Finder → Creator 交接预览】\n演示工作区：${workspace}\n蓝图版本：v${t.version}\n\n原始需求\n${t.request}\n\n${Object.entries(blockNames).map(([k,n])=>n+'\n'+t.blueprint[k]).join('\n\n')}\n\n资料状态\n${t.sourceIncomplete?'部分来源尚未返回；草稿为暂定材料，需先补齐核对。':'演示资料已返回，仍未实时核验。'}\n\n证据边界\n本地设计原型；没有创建真实会话、没有发送草稿、没有安装或运行插件。`}
function handoff(t){openDialog('准备在 Creator 继续','先核对带入的蓝图与工作区。',`${t.sourceIncomplete?'<div class="notice"><strong>部分来源尚未补齐</strong>这里仅准备暂定交接材料；建议先返回蓝图重试查找，核对后再继续真实交接。</div>':''}<div class="notice"><strong>你将预览蓝图 v${t.version} 的交接草稿</strong>原需求、补充边界、首版范围与验收条件都会带入。选择的是虚构的演示工作区。</div><label class="field-label" for="workspace-select">在哪里继续？</label><select id="workspace-select"><option value="">选择一个演示工作区</option><option value="阅读与成长（演示工作区）">阅读与成长（演示工作区）</option><option value="独立测试（演示工作区）">独立测试（演示工作区）</option></select><p class="small muted" style="margin-top:12px">这一步不访问你的真实工作区，也不会创建 session。</p>`,button('生成交接预览','generate-handoff','primary','disabled id="generate-handoff"'))}
function showHandoff(t){openDialog('交接预览已准备好','本地预览 · 未创建真实 Creator 会话',`<div class="notice success"><strong>草稿已经在这里展开</strong>这只证明本地交接材料已生成。没有创建会话、发送消息、生成插件或安装。</div><div class="code-preview">${esc(t.handoff.text)}</div>`,button('复制交接内容','copy-handoff','primary')+button('完成预览','close-modal','secondary'))}
function history(){const drafts=state.homeDrafts.length?'<h3>未提交的想法</h3>'+state.homeDrafts.map(d=>`<article class="history-item"><p>${esc(d.text)}</p><div class="history-action"><span>切换示例前保留的输入</span>${button('恢复输入','restore-home-draft','secondary small',`data-id="${d.id}"`)}</div></article>`).join('')+'<h3>已经开始的需求</h3>':'';openDialog('继续一条记录','仅保存在本浏览器的本次会话；不读取真实 Finder 历史。',drafts+(state.tasks.length?state.tasks.map(t=>`<article class="history-item"><h3>${esc(t.title)}</h3><p>${esc(t.request.slice(0,110))}${t.request.length>110?'…':''}</p><div class="history-action"><span>${t.status==='searching'?'查找演示中':t.status==='cancelled'?'已停止':t.status==='unknown'?'想法已保留':t.mode==='blueprint'?'蓝图 v'+t.version:t.mode==='clarify'?'等一句范围确认':'方案 v'+t.version}${t.draft?' · 有未提交补充':''}${Object.keys(t.blockDrafts||{}).length?' · 有暂存编辑':''}</span>${button('继续','restore','secondary small',`data-id="${t.id}"`)}</div></article>`).join(''):'<p>还没有记录。可以在首页写下一句想完成的事，也可以点一个完整需求示例。</p>'))}
function about(){openDialog('原型说明与演示情景','Finder 体验重设计 V2 · 2026-10-23',`<p>这是一个离线可点击的设计原型。所有推荐、对话、工作区和交接都是有限脚本；没有连接模型、真实搜索、资料或 Creator。</p><h3>可以体验什么</h3><p>用示例找方案，补一句修改同一成果，再把它整理成可编辑蓝图。未知需求会原样保留，不冒充已理解。</p><h3>切换下一次查找的情景</h3><div class="scenario-list">${button('正常返回演示资料'+(state.scenario==='normal'?' <span>已选</span>':''),'scenario','secondary'+(state.scenario==='normal'?' selected':''),'data-value="normal"')}${button('有一部分来源没有返回'+(state.scenario==='incomplete'?' <span>已选</span>':''),'scenario','secondary'+(state.scenario==='incomplete'?' selected':''),'data-value="incomplete"')}</div><h3>记录怎样保留</h3><p>需求、对话、未提交补充和暂存编辑只写入独立的 sessionStorage。回首页不会清掉当前记录；关闭此浏览器会话后可能消失。不会触碰真实 Finder 的存储。</p><div class="status-line">原型走查可以验证这里的布局与脚本交互，不能证明真实服务接通、任务效果或用户接受。</div>`)}
function interests(){openDialog('选择一个演示兴趣','只用这个选择调整首页顺序，不读取真实浏览记录或外部画像。',`<div class="choice-list"><label class="radio-choice"><input type="radio" name="interest" value="" ${!state.interest?'checked':''}>先看编辑精选</label>${products.map(p=>`<label class="radio-choice"><input type="radio" name="interest" value="${p.interest}" ${state.interest===p.interest?'checked':''}>${p.interest}</label>`).join('')}</div>`,button('应用到首页','save-interest','primary'))}
function prepare(t){const p=planInfo(t);const isReading=t.kind==='reading';const text=isReading?`阅读台账起步草稿\n\n目标：${t.scopeOnly?'只记录来源和阅读状态':'持续记录文章、访谈的来源、本人阅读状态与想法'}\n\n记录字段：标题、链接、阅读状态${t.scopeOnly?'':'、一句自己的想法'}\n边界：${t.readOnly?'原文只读；只写独立记录。':'先确认原文可读取的范围，记录与原文分开。'}\n确认：AI 摘要不能替代本人已读。\n\n待你补充：选择一个项目，手动提供第一篇文章或访谈。`:t.kind==='organize'?`会议待办起步草稿\n\n输入：你手动提供的一段会议记录\n产出：按负责人分组的候选待办，保留原文位置\n边界：归属与日期不明确就留待确认；确认前不写回工具\n待你补充：第一段可使用的会议记录`:`接入核对清单\n\n需求：${t.request}\n\n${products.find(p=>p.id===t.kind).requirements.map(x=>'□ '+x).join('\n')}\n\n当前边界：${products.find(p=>p.id===t.kind).limits}`;t.preparedText=text;save();openDialog(p.cta,'已生成本地起步材料；没有创建文件、安装或接入。',`<p>你可以先核对这份材料，再带到自己选择的项目里继续。</p><div class="code-preview">${esc(text)}</div><p class="small muted">需要更专用的入口，也可以沿当前需求继续形成蓝图。</p>`,button('复制起步材料','copy-prepared','primary')+button('继续定制','customize','secondary'))}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('内容已复制。')}catch{openDialog('可以手动复制内容','浏览器没有允许自动复制。',`<label for="manual-copy" class="field-label">选中并复制以下内容</label><textarea id="manual-copy" readonly>${esc(text)}</textarea>`);document.getElementById('manual-copy').select()}}
app.addEventListener('input',e=>{if(e.target.id==='home-input'){state.homeDraft=e.target.value;save()}if(e.target.id==='chat-input'){const t=current();if(t){t.draft=e.target.value;save()}}});
app.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='home-form')startTask(document.getElementById('home-input').value,state.createIntent);if(e.target.id==='chat-form')applyCorrection(document.getElementById('chat-input').value)});
app.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&e.target.tagName==='TEXTAREA'){e.preventDefault();e.target.form?.requestSubmit()}});
modal.addEventListener('input',e=>{if(e.target.id==='block-editor'){const t=current();if(t){t.blockDrafts[e.target.dataset.key]=e.target.value;save()}}});
modal.addEventListener('change',e=>{if(e.target.id==='workspace-select'){document.getElementById('generate-handoff').disabled=!e.target.value}});
modal.addEventListener('click',e=>{if(e.target===modal)closeDialog()});
modal.addEventListener('cancel',()=>{if(current()&&Object.keys(current().blockDrafts).length)announce('修改已暂存，之后可以继续编辑。')});
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,t=current();if(action==='home'){state.page='home';save();render();window.scrollTo({top:0});}else if(action==='about')about();else if(action==='history')history();else if(action==='close-modal')closeDialog();else if(action==='seed')seed(el.dataset.seed);else if(action==='product-seed'){const p=products.find(p=>p.id===el.dataset.id);replaceHomeDraft(p.prompt);state.page='home';save();closeDialogIfOpen();render();document.getElementById('home-input')?.focus();toast('场景需求已预填，可以改完再开始。')}else if(action==='detail')productDetail(el.dataset.id);else if(action==='interests')interests();else if(action==='save-interest'){state.interest=modal.querySelector('input[name="interest"]:checked')?.value||'';save();closeDialog();render();toast(state.interest?'已按你选择的演示兴趣调整顺序。':'已恢复编辑精选。')}else if(action==='scenario'){state.scenario=el.dataset.value;save();about();announce('下一次查找已切换演示情景。')}else if(action==='resume'){state.page='work';save();render();window.scrollTo({top:0});}else if(action==='restore'){state.activeId=el.dataset.id;state.page='work';save();closeDialog();render();window.scrollTo({top:0});}else if(action==='restore-home-draft'){const draft=state.homeDrafts.find(d=>d.id===el.dataset.id);if(draft){replaceHomeDraft(draft.text,draft.createIntent);state.page='home';save();closeDialog();render();document.getElementById('home-input')?.focus();toast('已恢复之前的未提交输入。')}}else if(action==='custom-seed'){replaceHomeDraft('我想做一个自己的阅读小助手：收集文章和访谈，记录读到哪、自己有什么想法。原文只读。',true);save();render();document.getElementById('home-input')?.focus();toast('已预填定制示例，修改后可以开始设计。')}else if(action==='cancel-search'&&t){epoch++;t.status='cancelled';t.stage=0;save();render();announce('查找已停止，原请求保留。')}else if(action==='retry-search'&&t)runSearch(t);else if(action==='retry-sources'&&t){cancelOtherOperations(t);const token=++epoch;t.status='searching';t.stage=2;save();render();announce('正在重新查找演示资料。');setTimeout(()=>{if(token!==epoch||t.status!=='searching')return;t.status='ready';t.stage=0;t.sourceIncomplete=false;message(t,'assistant','演示资料已补齐，暂定建议现在可以继续核对。原需求和当前方案保留。','这是本地恢复情景，没有执行真实搜索。');save();if(current()?.id===t.id)render();announce('演示资料已补齐。')},1000)}else if(action==='edit-request'&&t){replaceHomeDraft(t.request);state.page='home';save();render();document.getElementById('home-input')?.focus();toast('原需求已带回输入框；原方案仍在记录里。')}else if(action==='correction')applyCorrection(el.dataset.text);else if(action==='customize'&&t){closeDialogIfOpen();beginCreate(t)}else if(action==='clarify'&&t){message(t,'user',el.dataset.text);createBlueprint(t,el.dataset.text)}else if(action==='versions'&&t)versionDialog(t);else if(action==='keep-idea'){state.page='home';save();render();toast('想法已保留在继续记录里。')}else if(action==='prepare'&&t)prepare(t);else if(action==='alternative'&&t){t.version++;if(t.kind==='reading')t.scopeOnly=true;message(t,'user','先用更小的手动流程重新评估。');message(t,'assistant','已按更小的范围重新评估：先用手动提供的一份资料，检查记录和结果是否有用。原需求与前一版仍保留。','方案 v'+t.version+'；这是演示重新评估。');captureVersion(t,'改用更小的手动流程');save();render();announce('方案已按较小范围更新。')}else if(action==='edit-block'&&t){const key=el.dataset.key;openDialog('编辑'+blockNames[key],'只修改这一块；输入会暂存，关闭后仍可继续。',`<label for="block-editor" class="field-label">${blockNames[key]}</label><textarea id="block-editor" data-key="${key}">${esc(t.blockDrafts[key]??t.blueprint[key])}</textarea>`,button('应用到蓝图','save-block','primary',`data-key="${key}"`)+button('稍后继续','close-modal','secondary')+(t.blockDrafts[key]?button('放弃暂存修改','discard-block','ghost',`data-key="${key}"`):''));document.getElementById('block-editor').focus()}else if(action==='save-block'&&t){const key=el.dataset.key,value=document.getElementById('block-editor').value.trim();if(!value){toast('这一块先保留一段可核对的说明。');return}t.blueprint[key]=value;delete t.blockDrafts[key];t.version++;captureVersion(t,'编辑'+blockNames[key]);message(t,'assistant',blockNames[key]+'已应用到同一份蓝图。','蓝图 v'+t.version);save();closeDialog();render();announce('蓝图已更新到 v'+t.version)}else if(action==='discard-block'&&t){delete t.blockDrafts[el.dataset.key];save();closeDialog();render();toast('暂存修改已放弃，蓝图保留原内容。')}else if(action==='handoff'&&t)handoff(t);else if(action==='generate-handoff'&&t){const workspace=document.getElementById('workspace-select').value;if(!workspace)return;t.handoff={text:handoffText(t,workspace),version:t.version,workspace};save();showHandoff(t)}else if(action==='last-handoff'&&t)showHandoff(t);else if(action==='copy-handoff'&&t)await copyText(t.handoff.text);else if(action==='copy-prepared'&&t)await copyText(t.preparedText);else if(action==='original-plan'&&t){openDialog('原需求与第一版方案','蓝图仍保留在当前上下文里。',`<h3>你的原话</h3><p>${esc(t.request)}</p><h3>起步判断</h3><p>${esc(initialReply(t))}</p><div class="status-line">当前蓝图 v${t.version} 未改变。关闭后可以继续。</div>`)}});
save();render();
</script>
</body>
</html>
