name: Prepare or publish npm package

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Exact npm package name for this repository'
        required: true
        type: string
        default: '@oxmumu3/dsh-plugin-finder'
      publish:
        description: 'Publish the checked artifact using the configured npm trusted publisher'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-release-${{ inputs.package_name }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'oxmumu3/dsh-plugin-finder'
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      PACKAGE_NAME: ${{ inputs.package_name }}
      CONFIRMED_PACKAGE_NAME: ${{ vars.NPM_PACKAGE_NAME }}
      PUBLISH: ${{ inputs.publish }}
      SOURCE_REF: ${{ github.ref }}
    steps:
      - name: Set artifact directory
        shell: bash
        run: echo "ARTIFACT_DIR=$RUNNER_TEMP/finder-npm" >> "$GITHUB_ENV"
      - name: Check publication authorization
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PACKAGE_NAME" == '@oxmumu3/dsh-plugin-finder' ]] || { echo 'This repository only prepares its canonical npm package.' >&2; exit 1; }
          if [[ "$PUBLISH" == "true" ]]; then
            [[ "$SOURCE_REF" == 'refs/heads/main' ]] || { echo 'Publishing requires the main branch.' >&2; exit 1; }
            [[ -n "$CONFIRMED_PACKAGE_NAME" && "$PACKAGE_NAME" == "$CONFIRMED_PACKAGE_NAME" ]] || { echo 'Configure NPM_PACKAGE_NAME after confirming ownership; it must exactly match the input.' >&2; exit 1; }
          fi
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check Node and npm versions
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const [major, minor, patch] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
          if (Number(process.versions.node.split('.')[0]) < 24 || !(major > 11 || major === 11 && (minor > 5 || minor === 5 && patch >= 1))) throw new Error('Node >=24 and npm >=11.5.1 are required');
          NODE
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm test
      - run: npm run build
      - name: Prepare and independently verify public package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          node release/prepare-npm.mjs --package-name "$PACKAGE_NAME" --output "$ARTIFACT_DIR"
          archives=("$ARTIFACT_DIR"/*.tgz)
          [[ ${#archives[@]} == 1 && -f "${archives[0]}" ]]
          node release/check-npm-package.mjs --package-name "$PACKAGE_NAME" --tarball "${archives[0]}"
          cd "$ARTIFACT_DIR"
          sha256sum --check SHA256SUMS
          TARBALL_PATH="${archives[0]}" node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const digest = createHash('sha256').update(readFileSync(process.env.TARBALL_PATH)).digest('hex');
          appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${digest}\n`);
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload
        with:
          name: finder-npm-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.ARTIFACT_DIR }}/*.tgz
            ${{ env.ARTIFACT_DIR }}/manifest.json
            ${{ env.ARTIFACT_DIR }}/SHA256SUMS

  publish:
    needs: prepare
    if: inputs.publish && github.repository == 'oxmumu3/dsh-plugin-finder' && github.ref == 'refs/heads/main' && inputs.package_name == '@oxmumu3/dsh-plugin-finder' && vars.NPM_PACKAGE_NAME != '' && vars.NPM_PACKAGE_NAME == inputs.package_name
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_NAME: ${{ inputs.package_name }}
      VALIDATED_SHA256: ${{ needs.prepare.outputs.sha256 }}
    steps:
      - name: Set artifact directory
        shell: bash
        run: echo "ARTIFACT_DIR=$RUNNER_TEMP/finder-npm" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check Node and npm versions for OIDC
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const [major, minor, patch] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
          if (Number(process.versions.node.split('.')[0]) < 24 || !(major > 11 || major === 11 && (minor > 5 || minor === 5 && patch >= 1))) throw new Error('Node >=24 and npm >=11.5.1 are required for OIDC');
          NODE
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: ${{ env.ARTIFACT_DIR }}
          merge-multiple: true
          digest-mismatch: error
      - name: Verify downloaded artifact metadata
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, lstatSync, readFileSync, readdirSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';
          const { ARTIFACT_DIR, PACKAGE_NAME, GITHUB_OUTPUT, VALIDATED_SHA256 } = process.env;
          if (PACKAGE_NAME !== '@oxmumu3/dsh-plugin-finder') throw new Error('Unexpected package identity');
          const manifest = JSON.parse(readFileSync(path.join(ARTIFACT_DIR, 'manifest.json'), 'utf8'));
          if (manifest.packageName !== PACKAGE_NAME || manifest.sourceRepository !== 'https://github.com/oxmumu3/dsh-plugin-finder.git') throw new Error('Artifact identity does not match this repository');
          if (!/^[a-f0-9]{64}$/.test(VALIDATED_SHA256 ?? '') || manifest.sha256 !== VALIDATED_SHA256) throw new Error('Artifact hash does not match independent preparation SHA256 output');
          if (typeof manifest.tarball !== 'string' || !/^[a-z0-9][a-z0-9._-]*\.tgz$/.test(manifest.tarball)) throw new Error('Unsafe artifact filename');
          const expected = ['manifest.json', 'SHA256SUMS', manifest.tarball].sort();
          if (JSON.stringify(readdirSync(ARTIFACT_DIR).sort()) !== JSON.stringify(expected) || expected.some(name => !lstatSync(path.join(ARTIFACT_DIR, name)).isFile())) throw new Error('Expected exactly three regular artifact files');
          if (!/^[a-f0-9]{64}$/.test(manifest.sha256) || readFileSync(path.join(ARTIFACT_DIR, 'SHA256SUMS'), 'utf8') !== `${manifest.sha256}  ${manifest.tarball}\n`) throw new Error('Invalid SHA256 checksum manifest');
          const archive = path.join(ARTIFACT_DIR, manifest.tarball);
          if (lstatSync(archive).size > 25 * 1024 * 1024 || createHash('sha256').update(readFileSync(archive)).digest('hex') !== VALIDATED_SHA256) throw new Error('Artifact SHA256 hash mismatch');
          const pkg = JSON.parse(execFileSync('tar', ['-xOf', archive, 'package/package.json'], { encoding: 'utf8', maxBuffer: 1024 * 1024, timeout: 10000 }));
          if (pkg.name !== PACKAGE_NAME || typeof manifest.version !== 'string' || pkg.version !== manifest.version) throw new Error('Package name/version does not match artifact manifest');
          if (pkg.publishConfig?.access !== 'public' || pkg.publishConfig?.tag !== 'latest' || pkg.publishConfig?.registry !== 'https://registry.npmjs.org/') throw new Error('Incorrect publication metadata');
          appendFileSync(GITHUB_OUTPUT, `tarball=${manifest.tarball}\n`);
          NODE
      - name: Publish the verified artifact with OIDC
        shell: bash
        env:
          TARBALL_NAME: ${{ steps.verify.outputs.tarball }}
        run: npm publish "$ARTIFACT_DIR/$TARBALL_NAME" --access public --tag latest --provenance --registry https://registry.npmjs.org/ --ignore-scripts
